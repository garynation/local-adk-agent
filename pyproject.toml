[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-adk-agent"
version = "0.1.0"
description = "Containerized Google ADK personal assistant with Search Grounding, Deep Research, Personal Google Workspace OAuth 2.0, Google Chat Pub/Sub, and Headless Chrome."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.10.0",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.1",
    "google-cloud-pubsub>=2.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "playwright>=1.50.0",
    "mcp>=1.3.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.21.0",
    "sqlalchemy>=2.0.38",
    "greenlet>=3.1.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
